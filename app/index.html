<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Heist — Diagonal Cover Maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <h1>Neon Heist</h1>
    <p class="tagline">Two photos, one diagonal slash, a neon night poster. Your photos never leave this machine.</p>

    <fieldset class="photo-slot">
      <legend>Hero photo — top panel</legend>
      <label class="file-label">Choose a photo <input id="photo-hero" type="file" accept="image/*"></label>
      <button id="sample-hero" type="button">Use sample photo</button>
      <label>Zoom <input id="zoom-hero" type="range" min="1" max="2.5" step="0.01" value="1"></label>
      <label>Left / right <input id="dx-hero" type="range" min="-1" max="1" step="0.01" value="0"></label>
      <label>Up / down <input id="dy-hero" type="range" min="-1" max="1" step="0.01" value="0"></label>
    </fieldset>

    <fieldset class="photo-slot">
      <legend>Partner photo — bottom panel</legend>
      <label class="file-label">Choose a photo <input id="photo-partner" type="file" accept="image/*"></label>
      <button id="sample-partner" type="button">Use sample photo</button>
      <label>Zoom <input id="zoom-partner" type="range" min="1" max="2.5" step="0.01" value="1"></label>
      <label>Left / right <input id="dx-partner" type="range" min="-1" max="1" step="0.01" value="0"></label>
      <label>Up / down <input id="dy-partner" type="range" min="-1" max="1" step="0.01" value="0"></label>
    </fieldset>

    <label>Caption <input id="caption" type="text" maxlength="32" value="Neon Heist"></label>
    <label>Subtitle <input id="subtitle" type="text" maxlength="40" value="two crews, one night"></label>

    <label>Night grade
      <select id="grade">
        <option value="neon" selected>Neon Heist — magenta &amp; cyan</option>
        <option value="sunset">Vice Sunset — orange &amp; pink</option>
        <option value="midnight">Midnight — teal &amp; blue</option>
      </select>
    </label>

    <label>Post size
      <select id="size">
        <option value="square" selected>Square 1080 x 1080</option>
        <option value="portrait">Portrait 1080 x 1350</option>
        <option value="landscape">Landscape 1920 x 1080</option>
      </select>
    </label>

    <div class="export-row">
      <button id="export" type="button">Export this size as PNG</button>
      <button id="export-all" type="button">Export all three sizes</button>
    </div>
    <p id="status" role="status"></p>
  </section>

  <section class="preview" aria-label="Live cover preview">
    <canvas id="cover" width="1080" height="1080" aria-label="The cover"></canvas>
    <p class="hint">Live preview — drag the sliders to crop and position each photo.</p>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
